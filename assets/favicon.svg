<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2550"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- tall tile: a bar chart -->
  <rect x="10" y="10" width="21" height="44" rx="5" fill="#7c9bff"/>
  <rect x="14.5" y="36" width="4" height="13" rx="1.5" fill="#0b1020"/>
  <rect x="22.5" y="27" width="4" height="22" rx="1.5" fill="#0b1020"/>
  <!-- two stacked tiles -->
  <rect x="35" y="10" width="19" height="20" rx="5" fill="#6ee7b7"/>
  <rect x="35" y="34" width="19" height="20" rx="5" fill="#7c9bff" opacity=".55"/>
