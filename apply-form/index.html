<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply Form — Pacific Discovery</title>
<meta name="description" content="Edit the online application (apply.pacificdiscovery.org) — fields, programs, prices and travel dates — and follow each applicant through application, interview and fee.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --topaz:#55bbd2;--teal:#288195;--teal-dk:#1f6b7c;--green:#81c243;--ink:#2f2f2f;--body:#4a4a4a;--muted:#5f666b;
  --line:#e1e6e8;--bg:#f4f6f7;--panel:#fff;--soft:#eef6f8;--warn:#8a4b00;--warn-bg:#fff4e0;--bad:#a8321d;--bad-bg:#fdecea;--ok:#3c6b14;--ok-bg:#e9f5dd;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100vh;font-family:Poppins,system-ui,sans-serif;color:var(--body);background:var(--bg);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
h1,h2,h3{margin:0;color:var(--ink)}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn--primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn--primary:hover{background:var(--teal-dk);border-color:var(--teal-dk)}
.btn--danger{color:var(--bad);border-color:#f0c9c2}
.btn--danger:hover{background:var(--bad-bg)}
.btn--sm{min-height:30px;padding:0 10px;font-size:13px}
.btn--icon{width:30px;min-height:30px;padding:0}
.btn--link{border:0;background:none;color:var(--teal);padding:0;min-height:0;text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip--draft{background:#eef0f1;color:#4f565b}
.chip--live{background:var(--ok-bg);color:var(--ok)}
.chip--changes{background:var(--warn-bg);color:var(--warn)}
.chip--bad{background:var(--bad-bg);color:var(--bad)}
.chip--info{background:var(--soft);color:var(--teal-dk)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>label,.field>.lbl{font-size:12px;font-weight:600;color:var(--ink)}
.field .help{font-size:12px;color:var(--muted)}
.field input[type=text],.field input[type=url],.field input[type=number],.field input[type=email],.field select,.field textarea,.inp{width:100%;border:1px solid #cfd7da;border-radius:8px;padding:7px 10px;background:#fff;min-height:36px}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:2px solid var(--topaz);outline-offset:0;border-color:var(--topaz)}
.check{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;font-size:13px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--teal);flex:0 0 auto}
.check>span{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* chrome */
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
#app{flex:1 1 auto;min-height:0;overflow:auto}
.tabs,#notices{flex:0 0 auto}
.bar h1{font-size:22px}
.bar .spacer{flex:1}
.crumb{font-size:13px;color:var(--muted);text-decoration:none}
.save-state{font-size:12px;color:var(--muted);min-width:90px}
.save-state.err{color:var(--bad);font-weight:600}
.tabs{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.notice{padding:10px 16px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice--warn{background:var(--warn-bg);color:var(--warn)}
.notice--bad{background:var(--bad-bg);color:var(--bad)}
.notice--info{background:var(--soft);color:var(--teal-dk)}
.page{max-width:1200px;margin:0 auto;padding:20px 16px 60px}

/* fields tab */
.work{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
.canvas{overflow:auto;background:#e9eef0;padding:18px}
.canvas .sheet{max-width:820px;margin:0 auto;background:#fff;border-radius:14px;padding:26px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
.canvas .stepbar{max-width:820px;margin:0 auto 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:0 12px;min-height:32px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--soft);color:var(--teal);font-weight:600}
.inspector{background:#fff;border-left:1px solid var(--line);overflow:auto}
.insp-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:#fff;z-index:2}
.insp-head h2{font-size:15px}
.insp-body{padding:14px}
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.sec__head{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fafbfb;border-bottom:1px solid var(--line)}
.sec__head .t{flex:1;font-weight:600;color:var(--ink);cursor:pointer}
.frow{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid #f0f2f3;font-size:13px}
.frow:last-child{border-bottom:0}
.frow .t{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .t:hover{color:var(--teal)}
.frow.off .t{color:#9aa1a5}
.frow .ty{font-size:11px;color:var(--muted);background:#f1f3f4;border-radius:4px;padding:1px 6px}
.frow .tag{font-size:11px;border-radius:4px;padding:1px 6px}
.frow .tag.req{color:var(--bad)}
.frow .tag.if{background:var(--soft);color:var(--teal-dk)}
.addrow{padding:8px 10px}
.lint{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.lint--error{background:var(--bad-bg);color:var(--bad)}
.lint--warn{background:var(--warn-bg);color:var(--warn)}
.lint ul{margin:4px 0 0;padding-left:18px}
.rule{display:grid;grid-template-columns:1.2fr .9fr 1.2fr 30px;gap:6px;margin-bottom:6px;align-items:center}
details.adv{border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
details.adv summary{cursor:pointer;font-weight:600;color:var(--ink);font-size:13px;margin-bottom:10px}
.kv{font-size:12px;color:var(--muted);margin-bottom:8px}
.kv code{background:#f1f3f4;border-radius:4px;padding:1px 5px;color:var(--ink)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
@media (max-width:980px){body{height:auto;display:block}.work{grid-template-columns:1fr;height:auto}.canvas{max-height:70vh}.inspector{border-left:0;border-top:1px solid var(--line)}}

/* tables */
table.grid{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grid th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:9px 10px;background:#fafbfb;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid tr:last-child td{border-bottom:0}
.grid input,.grid select{width:100%;border:1px solid transparent;border-radius:6px;padding:5px 7px;background:transparent;min-height:32px}
.grid input:hover,.grid select:hover{border-color:var(--line)}
.grid input:focus,.grid select:focus{border-color:var(--topaz);outline:none;background:#fff}
.grid .num{width:110px}
.grid tr.inactive td{opacity:.55}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.panel h2{font-size:18px;margin-bottom:4px}
.panel .sub{color:var(--muted);margin:0 0 14px;font-size:13px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 18px}

/* applications */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .chipbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.filters .chipbtn[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.dots{display:flex;gap:4px}
.dots span{width:22px;height:6px;border-radius:999px;background:#dfe5e7}
.dots span.on{background:var(--teal)}
.dots span.paid{background:var(--green)}
.apps tr{cursor:pointer}
.apps tr:hover td{background:#fafcfc}
.nm{font-weight:600;color:var(--ink)}
.em{font-size:12px;color:var(--muted)}
dialog{border:0;border-radius:14px;padding:0;max-width:760px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,30,35,.45)}
.dlg-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:#fff}
.dlg-head h2{font-size:22px}
.dlg-body{padding:16px 20px;max-height:70vh;overflow:auto}
.ans{display:grid;grid-template-columns:minmax(160px,40%) 1fr;gap:4px 14px;font-size:13px;margin-bottom:14px}
.ans dt{color:var(--muted)}
.ans dd{margin:0;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.ans h3{grid-column:1/-1;font-size:14px;margin:10px 0 4px;color:var(--teal)}
.sync{font-size:13px;margin:0 0 12px;padding:0;list-style:none}
.sync li{display:flex;gap:8px;padding:3px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 16px;border-radius:10px;z-index:100;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.loading{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="bar">
  <a class="crumb" href="/">← Dashboards</a>
  <h1 class="serif">Apply Form</h1>
  <span id="status-chip"></span>
  <span class="save-state" id="save-state" aria-live="polite"></span>
  <span class="spacer"></span>
  <a class="btn btn--sm" id="open-live" target="_blank" rel="noopener" href="#">Open live form ↗</a>
  <button class="btn btn--sm" id="btn-versions" type="button">Versions</button>
  <button class="btn btn--sm btn--danger hidden" id="btn-discard" type="button">Discard changes</button>
  <button class="btn btn--primary" id="btn-publish" type="button">Publish</button>
</header>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="fields" aria-selected="true">Form fields</button>
  <button role="tab" data-tab="programs" aria-selected="false">Programs &amp; dates</button>
  <button role="tab" data-tab="settings" aria-selected="false">Fee, interview &amp; text</button>
  <button role="tab" data-tab="apps" aria-selected="false">Applications</button>
</nav>
<div id="notices"></div>
<main id="app"><div class="loading">Loading…</div></main>

<dialog id="dlg"></dialog>
<script type="module" src="/apply-form/editor.js"></script>
</body>
</html>
