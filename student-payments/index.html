<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Payments — Pacific Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/student-payments.css">
<script src="/assets/lightbox.js" defer></script>
</head>
<body>
<div class="bar">
  <a class="crumb" href="/">← Dashboards</a>
  <h1 class="serif">Student Payments</h1>
  <span class="muted">Pacific Discovery</span>
  <span class="spacer"></span>
  <span class="sync-state" id="syncState">—</span>
  <button class="btn btn--primary" id="syncBtn">Sync now</button>
</div>
<main>
  <div id="notices"></div>
  <div class="grid" id="stats"></div>

  <section class="panel">
    <header>
      <h2>Payments</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
      <input class="inp search" id="q" type="search" placeholder="Search payer, reference, deal…" aria-label="Search payments">
    </header>
    <div id="list"><div class="empty">Loading…</div></div>
  </section>

  <section class="panel">
    <header><h2>Application PDFs</h2><span class="muted" id="pdfLine"></span></header>
    <ul class="pdf-errs" id="pdfErrs"></ul>
  </section>

  <section class="panel">
    <header><h2>Quiz, referral, popup &amp; Meta lead PDFs</h2><span class="muted" id="formLine"></span><button class="btn btn--sm" id="formRunBtn">Attach now</button></header>
    <ul class="pdf-errs" id="formErrs"></ul>
  </section>
</main>

<script>window.SP_CONFIG = { api: '/api/student-payments' };</script>
<script src="/assets/student-payments.js"></script>
<script>
// ── lead-form PDFs (/api/form-attachments) ─────────────────────────────────
const FORM_API = '/api/form-attachments';
const KIND_LABEL = { quiz: 'Quizzes', referral: 'Referrals', step1: 'Applications started (step 1 only)', meta: 'Meta lead forms' };
async function formApi(method, body) {
  const res = await fetch(FORM_API, { method, credentials: 'include', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  let data = null; try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
  return data;
}
async function loadForms() {
  const s = await formApi('GET');
  const r = s.state?.last_result || {};
  const meta = r.metaIngest?.skipped ? ' · Meta: not connected (set META_LEADS_TOKEN + META_PAGE_IDS)' : r.metaIngest?.error ? ` · Meta: ${r.metaIngest.error}` : '';
  $('#formLine').textContent = (s.state?.last_run_at ? `Last run ${when(s.state.last_run_at)}` : 'Not run yet') + meta + ' · popups attach as they’re submitted';
  const items = [];
  for (const [kind, label] of Object.entries(KIND_LABEL)) {
    const k = s.kinds[kind] || {};
    if (k.error) { items.push(`<li><strong>${esc(label)}</strong> — <span class="muted">${esc(k.error)}</span></li>`); continue; }
    items.push(`<li><strong>${esc(label)}</strong> — ${k.attached} attached · ${k.waiting} waiting${k.errors ? ` · ${k.errors} retrying` : ''}</li>`);
    for (const e of (k.recentErrors || []).slice(0, 5)) {
      items.push(`<li class="muted" style="padding-left:16px">${esc(e.who)} — ${esc(e.error)} (${e.attempts} tries) <button class="btn btn--sm" data-form-retry="${esc(e.id)}" data-kind="${kind}">Retry</button></li>`);
    }
  }
  $('#formErrs').innerHTML = items.join('');
}
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button[data-form-retry]'); if (!t) return;
  try { await formApi('POST', { action: 'retry', kind: t.dataset.kind, id: t.dataset.formRetry }); toast('Will retry on the next run.'); } catch (x) { toast(x.message); }
});
$('#formRunBtn').addEventListener('click', async () => {
  const b = $('#formRunBtn'); b.disabled = true; b.textContent = 'Attaching…';
  try {
    const { result } = await formApi('POST', { action: 'run' });
    if (result.skipped) toast('Already running — try again in a minute.');
    else toast(`${Object.keys(KIND_LABEL).reduce((n, k) => n + (result[k]?.attached || 0), 0)} PDFs attached${result.metaIngest?.added ? ` · ${result.metaIngest.added} new Meta leads` : ''}`);
    await loadForms();
  } catch (x) { toast(x.message); }
  b.disabled = false; b.textContent = 'Attach now';
});

loadForms().catch((x) => { $('#formErrs').innerHTML = `<li class="muted">${esc(x.message)}</li>`; });
</script>
</body>
</html>
