<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Programs</title>
<meta name="description" content="Manage the programs students choose in the flight booking portal — arrival airport, arrival date/time, and program end date/time.">
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; }
  .loading-spinner { border: 4px solid #e5e7eb; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input, select { font-family: inherit; }
  .fld { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: #111827; }
  .fld:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  th { position: sticky; top: 0; background: #f9fafb; z-index: 5; }
  .row-saving td { background: #fef3c7; }
  #toast { position: fixed; bottom: 24px; right: 24px; z-index: 60; padding: 10px 16px; border-radius: 8px; font-size: 13px; background: #1f2937; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.25); opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { background: #b91c1c; }
</style>
</head>
<body class="text-gray-800">
<div class="max-w-6xl mx-auto px-4 py-8">

  <div class="flex items-center justify-between mb-2">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">🗓️ Flight Programs</h1>
      <p class="text-sm text-gray-500 mt-1">These programs power the student flight booking portal. Set the arrival airport, arrival date/time, and program end date/time.</p>
    </div>
    <a href="/" class="text-sm text-blue-600 hover:underline">← Dashboards</a>
  </div>

  <!-- Add form -->
  <div class="bg-white border border-gray-200 rounded-xl p-5 mt-5 shadow-sm">
    <h2 class="text-sm font-semibold text-gray-700 mb-3">Add a program</h2>
    <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
      <div class="md:col-span-4">
        <label class="block text-xs font-medium text-gray-600 mb-1">Program name</label>
        <input id="f-name" class="fld" placeholder="Barcelona — Spring 2026">
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-medium text-gray-600 mb-1">Airport (IATA)</label>
        <input id="f-airport" class="fld uppercase" maxlength="3" placeholder="BCN">
      </div>
      <div class="md:col-span-3">
        <label class="block text-xs font-medium text-gray-600 mb-1">Arrival date/time</label>
        <input id="f-arrival" type="datetime-local" class="fld">
      </div>
      <div class="md:col-span-3">
        <label class="block text-xs font-medium text-gray-600 mb-1">Program end date/time</label>
        <input id="f-ends" type="datetime-local" class="fld">
      </div>
    </div>
    <div class="mt-3">
      <button id="add-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg">Add program</button>
      <span id="add-err" class="text-sm text-red-600 ml-3"></span>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white border border-gray-200 rounded-xl mt-6 shadow-sm overflow-hidden">
    <div class="flex items-center justify-between px-5 py-3 border-b border-gray-100">
      <h2 class="text-sm font-semibold text-gray-700">All programs</h2>
      <label class="text-xs text-gray-500 flex items-center gap-2">
        <input id="show-inactive" type="checkbox" class="rounded"> show inactive
      </label>
    </div>
    <div id="loading" class="flex justify-center py-16"><div class="loading-spinner"></div></div>
    <div id="table-wrap" class="hidden overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="text-left text-xs uppercase tracking-wide text-gray-500 border-b border-gray-200">
          <tr>
            <th class="px-4 py-3 font-medium">Program</th>
            <th class="px-4 py-3 font-medium">Airport</th>
            <th class="px-4 py-3 font-medium">Arrival</th>
            <th class="px-4 py-3 font-medium">Program end</th>
            <th class="px-4 py-3 font-medium">Order</th>
            <th class="px-4 py-3 font-medium">Active</th>
            <th class="px-4 py-3 font-medium text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-gray-100"></tbody>
      </table>
      <div id="empty" class="hidden text-center text-gray-400 py-12 text-sm">No programs yet — add one above.</div>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
var API = '/api/flight-programs';
var rowsEl = document.getElementById('rows');

function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (isErr ? ' error' : '');
  setTimeout(function(){ t.className = ''; }, 2600);
}
// ISO -> value for <input type="datetime-local"> (local time, no seconds/zone)
function toLocalInput(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var pad = function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

async function api(method, payload, query) {
  var url = API + (query || '');
  var opts = { method: method };
  if (payload) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(payload); }
  var resp = await fetch(url, opts);
  var data = await resp.json().catch(function(){ return {}; });
  if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
  return data;
}

async function load() {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('table-wrap').classList.add('hidden');
  var inc = document.getElementById('show-inactive').checked ? '?action=list&include_inactive=1' : '?action=list';
  try {
    var data = await api('GET', null, inc);
    render(data.programs || []);
  } catch (e) {
    toast('Load failed: ' + e.message, true);
  } finally {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('table-wrap').classList.remove('hidden');
  }
}

function render(programs) {
  rowsEl.innerHTML = '';
  document.getElementById('empty').classList.toggle('hidden', programs.length > 0);
  programs.forEach(function(p) {
    var tr = document.createElement('tr');
    tr.dataset.id = p.id;
    var active = p.is_active !== false; // list (active-only) omits the flag
    tr.innerHTML =
      '<td class="px-4 py-2"><input class="fld" data-f="name" value="'+esc(p.name)+'"></td>' +
      '<td class="px-4 py-2"><input class="fld uppercase" data-f="airport_code" maxlength="3" value="'+esc(p.airport_code)+'" style="width:80px"></td>' +
      '<td class="px-4 py-2"><input class="fld" type="datetime-local" data-f="arrival_at" value="'+toLocalInput(p.arrival_at)+'"></td>' +
      '<td class="px-4 py-2"><input class="fld" type="datetime-local" data-f="ends_at" value="'+toLocalInput(p.ends_at)+'"></td>' +
      '<td class="px-4 py-2"><input class="fld" type="number" data-f="sort_order" value="'+(p.sort_order!=null?p.sort_order:100)+'" style="width:72px"></td>' +
      '<td class="px-4 py-2 text-center"><input type="checkbox" data-f="is_active" '+(active?'checked':'')+'></td>' +
      '<td class="px-4 py-2 text-right whitespace-nowrap">' +
        '<button class="save-btn text-blue-600 hover:underline text-sm font-medium">Save</button>' +
        '<button class="del-btn text-red-500 hover:underline text-sm font-medium ml-4">Delete</button>' +
      '</td>';
    rowsEl.appendChild(tr);
  });
}

// Delegated save / delete
rowsEl.addEventListener('click', async function(e) {
  var tr = e.target.closest('tr'); if (!tr) return;
  var id = Number(tr.dataset.id);

  if (e.target.classList.contains('save-btn')) {
    var patch = {};
    tr.querySelectorAll('[data-f]').forEach(function(el){
      patch[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
    });
    tr.classList.add('row-saving');
    try { await api('POST', { action:'update', id:id, patch:patch }); toast('Saved'); }
    catch (err) { toast('Save failed: ' + err.message, true); }
    finally { tr.classList.remove('row-saving'); }
  }

  if (e.target.classList.contains('del-btn')) {
    var name = tr.querySelector('[data-f="name"]').value;
    if (!confirm('Delete program "' + name + '"? This cannot be undone.')) return;
    try { await api('POST', { action:'delete', id:id }); tr.remove(); toast('Deleted'); }
    catch (err) { toast('Delete failed: ' + err.message, true); }
  }
});

// Add
document.getElementById('add-btn').addEventListener('click', async function() {
  var errEl = document.getElementById('add-err'); errEl.textContent = '';
  var payload = {
    action: 'create',
    name: document.getElementById('f-name').value.trim(),
    airport_code: document.getElementById('f-airport').value.trim().toUpperCase(),
    arrival_at: document.getElementById('f-arrival').value,
    ends_at: document.getElementById('f-ends').value,
  };
  if (!payload.name || !payload.airport_code || !payload.arrival_at || !payload.ends_at) {
    errEl.textContent = 'Fill in name, airport, arrival and end date/time.'; return;
  }
  try {
    await api('POST', payload);
    ['f-name','f-airport','f-arrival','f-ends'].forEach(function(id){ document.getElementById(id).value=''; });
    toast('Program added');
    load();
  } catch (err) { errEl.textContent = err.message; }
});

document.getElementById('show-inactive').addEventListener('change', load);
load();
</script>
</body>
</html>
